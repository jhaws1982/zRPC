<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:838px;height:654px;background:#FFFFFF;" width="838px" height="654px" viewBox="0 0 838 654" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="326.83" y="24.966" fill="#000" font-size="14" textLength="178.205" font-weight="700">zRPC threads and sockets</text></g><!--cluster Client process--><g class="cluster" data-qualified-name="Client process" id="ent0001" data-source-line="8"><rect x="48" y="47.068" width="208" height="131" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="103.042" y="64.034" fill="#000" font-size="14" textLength="97.916" font-weight="700">Client process</text></g><!--cluster Server process--><g class="cluster" data-qualified-name="Server process" id="ent0003" data-source-line="12"><rect x="7" y="247.068" width="511" height="393" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="211.575" y="264.034" fill="#000" font-size="14" textLength="101.85" font-weight="700">Server process</text></g><!--cluster Publisher process--><g class="cluster" data-qualified-name="Publisher process" id="ent0021" data-source-line="39"><rect x="597" y="56.568" width="139" height="112" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="604.956" y="73.534" fill="#000" font-size="14" textLength="123.088" font-weight="700">Publisher process</text></g><!--cluster Subscriber process--><g class="cluster" data-qualified-name="Subscriber process" id="ent0023" data-source-line="42"><rect x="542" y="247.068" width="230" height="131" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="591.522" y="264.034" fill="#000" font-size="14" textLength="130.956" font-weight="700">Subscriber process</text></g><!--entity client--><g class="entity" data-qualified-name="Client process.client" id="ent0002" data-source-line="9"><rect x="63.5" y="85.068" width="176.925" height="77.204" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="73.5" y="110.034" fill="#000" font-size="14" textLength="37.674">Client</text><text x="73.5" y="129.102" fill="#000" font-size="14" textLength="156.925">pool of DEALER sockets,</text><text x="73.5" y="148.17" fill="#000" font-size="14" textLength="152.403">one per concurrent call</text></g><!--entity broker--><g class="entity" data-qualified-name="Server process.broker" id="ent0004" data-source-line="13"><rect x="23.5" y="294.568" width="256.725" height="58.136" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="33.5" y="319.534" fill="#000" font-size="14" textLength="184.141">Broker thread (Server::start)</text><text x="33.5" y="338.602" fill="#000" font-size="14" textLength="236.725">frontend ROUTER, backend ROUTER</text></g><!--entity memory--><g class="entity" data-qualified-name="Server process.memory" id="ent0005" data-source-line="14"><rect x="315.5" y="285.068" width="187.047" height="77.204" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="325.5" y="310.034" fill="#000" font-size="14" textLength="79.002">CallMemory</text><text x="325.5" y="329.102" fill="#000" font-size="14" textLength="167.047">request ID -> running call</text><text x="325.5" y="348.17" fill="#000" font-size="14" textLength="107.128">or finished reply</text></g><!--entity w1--><g class="entity" data-qualified-name="Server process.w1" id="ent0006" data-source-line="15"><rect x="57" y="463.568" width="80.074" height="58.136" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="67" y="488.534" fill="#000" font-size="14" textLength="60.074">Worker 1</text><text x="67" y="507.602" fill="#000" font-size="14" textLength="50.778">DEALER</text></g><!--entity wn--><g class="entity" data-qualified-name="Server process.wn" id="ent0007" data-source-line="16"><rect x="178.5" y="463.568" width="82.706" height="58.136" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="188.5" y="488.534" fill="#000" font-size="14" textLength="62.706">Worker N</text><text x="188.5" y="507.602" fill="#000" font-size="14" textLength="50.778">DEALER</text></g><!--entity funcs--><g class="entity" data-qualified-name="Server process.funcs" id="ent0008" data-source-line="17"><rect x="67" y="585.068" width="128.458" height="39.068" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="77" y="610.034" fill="#000" font-size="14" textLength="108.458">Bound functions</text></g><!--entity pub--><g class="entity" data-qualified-name="Publisher process.pub" id="ent0022" data-source-line="40"><rect x="616" y="94.568" width="81.992" height="58.136" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="626" y="119.534" fill="#000" font-size="14" textLength="61.992">Publisher</text><text x="626" y="138.602" fill="#000" font-size="14" textLength="27.804">PUB</text></g><!--entity sub--><g class="entity" data-qualified-name="Subscriber process.sub" id="ent0024" data-source-line="43"><rect x="558" y="285.068" width="197.883" height="77.204" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="568" y="310.034" fill="#000" font-size="14" textLength="70.056">Subscriber</text><text x="568" y="329.102" fill="#000" font-size="14" textLength="177.883">one thread and SUB socket</text><text x="568" y="348.17" fill="#000" font-size="14" textLength="107.114">per subscription</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="28"><path d="M276,92.068 L276,119.568 L240.62,123.568 L276,127.568 L276,155.186 A0,0 0 0 0 276,155.186 L577.592,155.186 A0,0 0 0 0 577.592,155.186 L577.592,102.068 L567.592,92.068 L276,92.068 A0,0 0 0 0 276,92.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M567.592,92.068 L567.592,102.068 L577.592,102.068 L567.592,92.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="282" y="110.965" fill="#000" font-size="13" textLength="279.344">Each call borrows an idle connection or opens</text><text x="282" y="128.671" fill="#000" font-size="13" textLength="280.592">one, stamps a new RequestId, and resends an</text><text x="282" y="146.377" fill="#000" font-size="13" textLength="229.723">unanswered request until its timeout.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="34"><path d="M534,461.068 L534,524.186 A0,0 0 0 0 534,524.186 L823.866,524.186 A0,0 0 0 0 823.866,524.186 L823.866,471.068 L813.866,461.068 L633.56,461.068 L469.93,362.258 L625.56,461.068 L534,461.068 A0,0 0 0 0 534,461.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M813.866,461.068 L813.866,471.068 L823.866,471.068 L813.866,461.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="540" y="479.965" fill="#000" font-size="13" textLength="268.866">A resend of a running call waits for that run;</text><text x="540" y="497.671" fill="#000" font-size="13" textLength="251.082">a resend of a finished call gets the stored</text><text x="540" y="515.377" fill="#000" font-size="13" textLength="232.96">reply. Neither runs the function again.</text></g><!--link client to broker--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk9" data-source-line="20" data-link-type="dependency"><path d="M152,162.278 C152,200.758 152,254.618 152,289.288" style="stroke:#181818;stroke-width:1;" fill="none" id="client-to-broker"/><polygon points="152,294.288,156,285.288,152,289.288,148,285.288,152,294.288" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="158.109" y="208.965" fill="#000" font-size="13" textLength="146.016">requests over TCP / IPC,</text><text x="153" y="226.671" fill="#000" font-size="13" textLength="156.234">resent under the same ID</text></g><!--link broker to memory--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk10" data-source-line="21" data-link-type="association"><path d="M280.75,323.568 C292.27,323.568 303.8,323.568 315.32,323.568" style="stroke:#181818;stroke-width:1;" fill="none" id="broker-memory"/></g><!--link broker to w1--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk11" data-source-line="22" data-link-type="dependency"><path d="M113.94,352.688 C101.66,364.028 89.54,378.188 83,394.068 C73.88,416.208 77.387,438.529 83.827,458.529" style="stroke:#181818;stroke-width:1;" fill="none" id="broker-to-w1"/><polygon points="85.36,463.288,86.409,453.495,83.827,458.529,78.794,455.947,85.36,463.288" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="84" y="408.965" fill="#000" font-size="13" textLength="132.418">only to an idle worker</text><text x="126.881" y="426.671" fill="#000" font-size="13" textLength="46.657">(inproc)</text></g><!--link broker to wn--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk12" data-source-line="23" data-link-type="dependency"><path d="M190.06,352.688 C202.34,364.028 214.46,378.188 221,394.068 C230.03,415.978 229.593,438.139 226.703,458.199" style="stroke:#181818;stroke-width:1;" fill="none" id="broker-to-wn"/><polygon points="225.99,463.148,231.232,454.81,226.703,458.199,223.314,453.67,225.99,463.148" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link w1 to funcs--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" id="lnk13" data-source-line="24" data-link-type="dependency"><path d="M105.67,521.608 C111.81,541.468 118.394,562.781 123.754,580.131" style="stroke:#181818;stroke-width:1;" fill="none" id="w1-to-funcs"/><polygo