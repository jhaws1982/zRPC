name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only libzmq installed: CPM downloads cppzmq and msgpack-cxx
          - name: gcc, fetched deps (amd64)
            os: ubuntu-24.04
            cxx: g++
            fetch: ON
            packages: libzmq3-dev
          - name: clang, system deps (amd64)
            os: ubuntu-24.04
            cxx: clang++
            fetch: OFF
            packages: libzmq3-dev cppzmq-dev libmsgpack-cxx-dev libgtest-dev
          - name: gcc, system deps (arm64)
            os: ubuntu-24.04-arm
            cxx: g++
            fetch: OFF
            packages: libzmq3-dev cppzmq-dev libmsgpack-cxx-dev libgtest-dev
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DZRPC_FETCH_DEPS=${{ matrix.fetch }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            sanitizers: address,undefined
          - name: TSan
            sanitizers: thread
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/tests/tsan.supp
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzmq3-dev
      # Ubuntu 24.04 kernels randomise more address bits than TSan supports
      - name: Reduce ASLR entropy for TSan
        if: matrix.sanitizers == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      # Download every dependency so GoogleTest is built with the sanitizer too
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DZRPC_SANITIZERS=${{ matrix.sanitizers }}
          -DCPM_USE_LOCAL_PACKAGES=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcovr libzmq3-dev cppzmq-dev libmsgpack-cxx-dev libgtest-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DZRPC_FETCH_DEPS=OFF
          -DZRPC_ENABLE_COVERAGE=ON
      - name: Test and generate coverage report
        run: cmake --build build --target zRPC_coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: test-reports/zRPC_coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  package:
    name: package (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libzmq3-dev cppzmq-dev libmsgpack-cxx-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr
          -DZRPC_FETCH_DEPS=OFF
          -DZRPC_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build
      - name: Package
        working-directory: build
        run: cpack -G "DEB;TGZ"
      - uses: actions/upload-artifact@v4
        with:
          name: zRPC-packages-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.tar.gz
      - name: Attach packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.deb build/*.tar.gz
